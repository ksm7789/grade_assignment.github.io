<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>반편성 프로그램 (학년용)</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      background: #ffffff;
    }

    /* 반응형 미디어 쿼리 */
    /* 데스크탑 (1200px 이상) - 기본 스타일 */
    
    /* 태블릿 (768px ~ 1199px) */
    @media (max-width: 1199px) {
      .main-container {
        padding: 1.5rem !important;
      }
      
      .result-grid {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }
    
    /* 태블릿 세로 (768px ~ 991px) */
    @media (max-width: 991px) {
      body {
        font-size: 14px;
      }
      
      h1 {
        font-size: 1.8rem !important;
      }
      
      h2 {
        font-size: 1.4rem !important;
      }
      
      h3 {
        font-size: 1.2rem !important;
      }
      
      button {
        font-size: 0.9rem !important;
        padding: 0.6rem 1.2rem !important;
      }
    }

    /* 모바일 (640px ~ 767px) */
    @media (max-width: 767px) {
      .main-container {
        padding: 1rem !important;
      }
      
      .result-grid {
        grid-template-columns: 1fr !important;
        gap: 1rem !important;
      }
      
      /* 버튼 그룹 세로 배치 */
      .button-group {
        flex-direction: column !important;
        gap: 0.5rem !important;
      }
      
      .button-group button {
        width: 100% !important;
      }
      
      /* 업로드 섹션 세로 배치 */
      .upload-section {
        flex-direction: column !important;
      }
      
      /* 금지 학생 설정 드롭다운 세로 배치 */
      .prohibit-dropdowns {
        flex-direction: column !important;
      }
      
      /* 완료/다운로드 버튼 세로 배치 */
      .action-buttons {
        flex-direction: column !important;
        gap: 0.75rem !important;
      }
      
      .action-buttons button {
        width: 100% !important;
        padding: 0.8rem 2rem !important;
      }
    }

    /* 작은 모바일 (480px 이하) */
    @media (max-width: 480px) {
      body {
        font-size: 13px;
      }
      
      .main-container {
        padding: 0.75rem !important;
      }
      
      h1 {
        font-size: 1.5rem !important;
      }
      
      h2 {
        font-size: 1.2rem !important;
      }
      
      h3 {
        font-size: 1rem !important;
      }
      
      button {
        font-size: 0.85rem !important;
        padding: 0.5rem 1rem !important;
      }
      
      /* 학생 카드 패딩 줄이기 */
      .student-card {
        padding: 0.5rem !important;
        font-size: 0.85rem !important;
      }
      
      /* 뱃지 크기 줄이기 */
      .badge {
        font-size: 0.65rem !important;
        padding: 0.15rem 0.4rem !important;
      }
    }
    
    /* 초소형 모바일 (360px 이하) */
    @media (max-width: 360px) {
      h1 {
        font-size: 1.3rem !important;
      }
      
      button {
        font-size: 0.8rem !important;
        padding: 0.45rem 0.8rem !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    // 아이콘 컴포넌트들
    const Upload = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
      </svg>
    );

    const Trash = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    );

    function App() {
      const [classFiles, setClassFiles] = useState([]);
      const [numClasses, setNumClasses] = useState(3);
      const [showClassModal, setShowClassModal] = useState(false);
      const [isUploadComplete, setIsUploadComplete] = useState(false);
      
      // 비밀번호 및 저장 관련 state
      const [password, setPassword] = useState('');
      const [isPasswordSet, setIsPasswordSet] = useState(false);
      const [inputPassword, setInputPassword] = useState('');
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordAttempts, setPasswordAttempts] = useState(0);

      // 페이지 새로고침 경고 (저장 기능이 있으므로 제거)
      /*
      useEffect(() => {
        const handleBeforeUnload = (e) => {
          if (classFiles.length > 0) {
            const message = '⚠️ 페이지를 새로고침하면 모든 데이터가 삭제됩니다. 계속하시겠습니까?';
            e.preventDefault();
            e.returnValue = message;
            return message;
          }
        };

        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [classFiles]);
      */

      // 초기 로드: localStorage에서 데이터 불러오기
      useEffect(() => {
        try {
          const savedPassword = localStorage.getItem('grade_assignment_password');
          const savedData = localStorage.getItem('grade_assignment_data');
          
          if (savedPassword) {
            // 비밀번호가 설정되어 있음
            setIsPasswordSet(true);
            setPassword(savedPassword);
            setIsUnlocked(false); // 잠금 상태
          } else {
            // 처음 사용 - 비밀번호 설정 필요
            setIsPasswordSet(false);
            setIsUnlocked(false); // 비밀번호 설정 모달 표시
          }
        } catch (error) {
          console.error('데이터 로드 오류:', error);
          setIsPasswordSet(false);
          setIsUnlocked(false);
        }
      }, []);

      // 비밀번호 확인
      const checkPassword = () => {
        const trimmedInput = inputPassword.trim();
        const trimmedPassword = password.trim();
        
        if (trimmedInput === trimmedPassword) {
          setIsUnlocked(true);
          setShowPasswordModal(false);
          setPasswordAttempts(0);
          setInputPassword('');
          
          // 저장된 데이터 로드
          try {
            const savedData = localStorage.getItem('grade_assignment_data');
            if (savedData) {
              const data = JSON.parse(savedData);
              setClassFiles(data.classFiles || []);
              setNumClasses(data.numClasses || 3);
              setIsUploadComplete(data.isUploadComplete || false);
            }
          } catch (error) {
            console.error('데이터 로드 오류:', error);
          }
        } else {
          const newAttempts = passwordAttempts + 1;
          setPasswordAttempts(newAttempts);
          
          if (newAttempts >= 5) {
            alert('비밀번호를 5회 틀렸습니다.\n보안을 위해 저장된 모든 데이터가 삭제됩니다.');
            localStorage.clear();
            window.location.reload();
          } else {
            alert(`비밀번호가 틀렸습니다. (${newAttempts}/5)`);
            setInputPassword('');
          }
        }
      };

      // 비밀번호 설정
      const setNewPassword = (pwd) => {
        const trimmedPwd = pwd.trim();
        if (trimmedPwd.length === 4 && /^\d{4}$/.test(trimmedPwd)) {
          setPassword(trimmedPwd);
          setIsPasswordSet(true);
          setIsUnlocked(true);
          localStorage.setItem('grade_assignment_password', trimmedPwd);
          alert('비밀번호가 설정되었습니다.');
        } else {
          alert('4자리 숫자를 입력해주세요.');
        }
      };

      // 자동 저장
      useEffect(() => {
        if (isUnlocked && isPasswordSet) {
          const dataToSave = {
            classFiles,
            numClasses,
            isUploadComplete
          };
          
          localStorage.setItem('grade_assignment_data', JSON.stringify(dataToSave));
        }
      }, [classFiles, numClasses, isUploadComplete, isUnlocked, isPasswordSet]);

      // 완전 초기화 함수
      const resetAll = () => {
        if (confirm('모든 데이터와 비밀번호를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) {
          const confirmPassword = prompt('비밀번호를 입력하세요:');
          if (confirmPassword === password) {
            localStorage.clear();
            window.location.reload();
          } else {
            alert('비밀번호가 틀렸습니다.');
          }
        }
      };

      // 업로드 완료 처리
      const handleUploadComplete = () => {
        if (classFiles.length === 0) {
          alert('업로드된 파일이 없습니다.');
          return;
        }
        setIsUploadComplete(true);
      };

      // 파일 수정하기 (업로드 완료 상태만 해제)
      const handleEditUpload = () => {
        setIsUploadComplete(false);
      };

      // 반편성 실행
      const executeAssignment = () => {
        if (!isUploadComplete) {
          alert('먼저 "업로드 완료" 버튼을 클릭해주세요.');
          return;
        }
        if (classFiles.length === 0) {
          alert('업로드된 파일이 없습니다.');
          return;
        }

        try {
          // 반별로 학생 데이터 취합 (A반, B반, C반 등)
          const classSummary = {};
          
          classFiles.forEach(file => {
            file.students.forEach(student => {
              const assignedClass = student.assignedClass;
              
              // '원본' 시트는 제외
              if (assignedClass === '원본') return;
              
              if (!classSummary[assignedClass]) {
                classSummary[assignedClass] = [];
              }
              
              classSummary[assignedClass].push(student);
            });
          });

          setResults(classSummary);
          setOriginalResults(JSON.parse(JSON.stringify(classSummary))); // 원본 저장
          alert('반편성이 완료되었습니다!');
        } catch (error) {
          alert('반편성 중 오류가 발생했습니다: ' + error.message);
        }
      };

      const [results, setResults] = useState(null);
      const [originalResults, setOriginalResults] = useState(null);
      const [isResultEditMode, setIsResultEditMode] = useState(false);
      const [selectedStudentsForSwap, setSelectedStudentsForSwap] = useState([]);
      const [nameSortOrder, setNameSortOrder] = useState({});
      const [genderSortOrder, setGenderSortOrder] = useState({});
      const [showProhibitModal, setShowProhibitModal] = useState(false);
      const [prohibitPairs, setProhibitPairs] = useState([]); // [{student1: {id, name, class}, student2: {id, name, class}}]
      const [forceUpdateKey, setForceUpdateKey] = useState(0);
      const [isCompleted, setIsCompleted] = useState(false); // 반편성 완료 여부

      // 가나다순 정렬
      const sortByName = (className) => {
        if (!results) return;
        
        const currentOrder = nameSortOrder[className] || 'none';
        const newOrder = currentOrder === 'asc' ? 'desc' : 'asc';
        
        const sortedStudents = [...results[className]].sort((a, b) => {
          if (newOrder === 'asc') {
            return a.name.localeCompare(b.name, 'ko');
          } else {
            return b.name.localeCompare(a.name, 'ko');
          }
        });
        
        setNameSortOrder({ ...nameSortOrder, [className]: newOrder });
        setGenderSortOrder({ ...genderSortOrder, [className]: 'none' });
        setResults({
          ...results,
          [className]: sortedStudents
        });
      };

      // 모든 반 가나다순 정렬
      const sortAllByName = () => {
        if (!results) return;
        
        const newResults = {};
        const newNameOrder = {};
        const newGenderOrder = {};
        
        Object.keys(results).forEach(className => {
          const currentOrder = nameSortOrder[className] || 'none';
          const newOrder = currentOrder === 'asc' ? 'desc' : 'asc';
          
          const sortedStudents = [...results[className]].sort((a, b) => {
            if (newOrder === 'asc') {
              return a.name.localeCompare(b.name, 'ko');
            } else {
              return b.name.localeCompare(a.name, 'ko');
            }
          });
          
          newResults[className] = sortedStudents;
          newNameOrder[className] = newOrder;
          newGenderOrder[className] = 'none';
        });
        
        setResults(newResults);
        setNameSortOrder(newNameOrder);
        setGenderSortOrder(newGenderOrder);
      };

      // 성별순 정렬
      const sortByGender = (className) => {
        if (!results) return;
        
        const currentOrder = genderSortOrder[className] || 'none';
        const newOrder = currentOrder === 'male-first' ? 'female-first' : 'male-first';
        
        const sortedStudents = [...results[className]].sort((a, b) => {
          // 성별 우선 정렬
          if (newOrder === 'male-first') {
            if (a.gender === '남성' && b.gender === '여성') return -1;
            if (a.gender === '여성' && b.gender === '남성') return 1;
          } else {
            if (a.gender === '여성' && b.gender === '남성') return -1;
            if (a.gender === '남성' && b.gender === '여성') return 1;
          }
          
          // 성별이 같으면 원래반 순서 유지
          const classA = parseInt(a.originalClass) || 0;
          const classB = parseInt(b.originalClass) || 0;
          if (classA !== classB) return classA - classB;
          
          // 원래반도 같으면 번호 순서
          return (parseInt(a.number) || 0) - (parseInt(b.number) || 0);
        });
        
        setGenderSortOrder({ ...genderSortOrder, [className]: newOrder });
        setNameSortOrder({ ...nameSortOrder, [className]: 'none' });
        setResults({
          ...results,
          [className]: sortedStudents
        });
      };

      // 모든 반 성별순 정렬
      const sortAllByGender = () => {
        if (!results) return;
        
        const newResults = {};
        const newGenderOrder = {};
        const newNameOrder = {};
        
        Object.keys(results).forEach(className => {
          const currentOrder = genderSortOrder[className] || 'none';
          const newOrder = currentOrder === 'male-first' ? 'female-first' : 'male-first';
          
          const sortedStudents = [...results[className]].sort((a, b) => {
            // 성별 우선 정렬
            if (newOrder === 'male-first') {
              if (a.gender === '남성' && b.gender === '여성') return -1;
              if (a.gender === '여성' && b.gender === '남성') return 1;
            } else {
              if (a.gender === '여성' && b.gender === '남성') return -1;
              if (a.gender === '남성' && b.gender === '여성') return 1;
            }
            
            // 성별이 같으면 원래반 순서 유지
            const classA = parseInt(a.originalClass) || 0;
            const classB = parseInt(b.originalClass) || 0;
            if (classA !== classB) return classA - classB;
            
            // 원래반도 같으면 번호 순서
            return (parseInt(a.number) || 0) - (parseInt(b.number) || 0);
          });
          
          newResults[className] = sortedStudents;
          newGenderOrder[className] = newOrder;
          newNameOrder[className] = 'none';
        });
        
        setResults(newResults);
        setGenderSortOrder(newGenderOrder);
        setNameSortOrder(newNameOrder);
      };

      // 원래대로 (정렬 초기화)
      const resetToOriginal = (className) => {
        if (!originalResults) return;
        
        setResults({
          ...results,
          [className]: [...originalResults[className]]
        });
        setNameSortOrder({ ...nameSortOrder, [className]: 'none' });
        setGenderSortOrder({ ...genderSortOrder, [className]: 'none' });
      };

      // 모든 반 원래대로
      const resetAllToOriginal = () => {
        if (!originalResults) return;
        
        const newResults = {};
        const newNameOrder = {};
        const newGenderOrder = {};
        
        Object.keys(originalResults).forEach(className => {
          newResults[className] = [...originalResults[className]];
          newNameOrder[className] = 'none';
          newGenderOrder[className] = 'none';
        });
        
        setResults(newResults);
        setNameSortOrder(newNameOrder);
        setGenderSortOrder(newGenderOrder);
      };

      // 학생 선택 (맞교환용)
      const toggleStudentSelection = (className, studentId) => {
        const selected = selectedStudentsForSwap.find(s => s.className === className && s.studentId === studentId);
        
        if (selected) {
          setSelectedStudentsForSwap(selectedStudentsForSwap.filter(s => !(s.className === className && s.studentId === studentId)));
        } else {
          if (selectedStudentsForSwap.length === 0) {
            setSelectedStudentsForSwap([{ className, studentId }]);
          } else if (selectedStudentsForSwap.length === 1) {
            // 같은 반인지 확인
            if (selectedStudentsForSwap[0].className === className) {
              alert('같은 반 내에서는 맞교환할 수 없습니다.');
              return;
            }
            // 두 번째 학생 선택 시 자동으로 교환
            const newSelection = [...selectedStudentsForSwap, { className, studentId }];
            swapStudentsAuto(newSelection);
          }
        }
      };

      // 학생 맞교환 (자동)
      const swapStudentsAuto = (selection) => {
        if (selection.length !== 2) return;

        const [student1, student2] = selection;
        
        // 같은 반인지 체크 (이미 toggleStudentSelection에서 체크하지만 안전장치)
        if (student1.className === student2.className) {
          alert('같은 반 내에서는 맞교환할 수 없습니다.');
          setSelectedStudentsForSwap([]);
          return;
        }
        
        // 학생 정보 찾기
        const class1Students = results[student1.className];
        const class2Students = results[student2.className];
        
        const s1 = class1Students.find(s => s.id === student1.studentId);
        const s2 = class2Students.find(s => s.id === student2.studentId);
        
        if (!s1 || !s2) return;
        
        // 확인 메시지
        const message = `${student1.className} ${s1.name} ↔ ${student2.className} ${s2.name}\n학생을 맞교환하시겠습니까?`;
        
        if (!confirm(message)) {
          setSelectedStudentsForSwap([]);
          return;
        }

        const newResults = { ...results };

        const class1StudentsCopy = [...newResults[student1.className]];
        const class2StudentsCopy = [...newResults[student2.className]];

        const idx1 = class1StudentsCopy.findIndex(s => s.id === student1.studentId);
        const idx2 = class2StudentsCopy.findIndex(s => s.id === student2.studentId);

        // 다른 반 간 교환
        const temp = class1StudentsCopy[idx1];
        class1StudentsCopy[idx1] = class2StudentsCopy[idx2];
        class2StudentsCopy[idx2] = temp;
        
        newResults[student1.className] = class1StudentsCopy;
        newResults[student2.className] = class2StudentsCopy;

        setResults(newResults);
        setSelectedStudentsForSwap([]);
      };

      // 학생 이동
      const moveStudent = (fromClass, studentId, toClass) => {
        if (fromClass === toClass) return;

        const newResults = { ...results };
        const fromStudents = [...newResults[fromClass]];
        const toStudents = [...newResults[toClass]];

        const studentIndex = fromStudents.findIndex(s => s.id === studentId);
        const student = fromStudents[studentIndex];

        fromStudents.splice(studentIndex, 1);
        toStudents.push(student);

        newResults[fromClass] = fromStudents;
        newResults[toClass] = toStudents;

        setResults(newResults);
      };

      // 엑셀 다운로드
      const downloadExcel = () => {
        if (!results) return;

        const wb = XLSX.utils.book_new();

        // 1. 취합 시트 (모든 학생 정보)
        const allStudentsData = [];
        Object.keys(results).sort().forEach(className => {
          results[className].forEach(student => {
            allStudentsData.push({
              '학생개인번호': student.studentId || '',
              '학년': student.grade || '',
              '반': student.originalClass,
              '번호': student.number,
              '이름': student.name,
              '성별': student.gender,
              '생년월일': student.birthDate || '',
              '특이사항': student.specialNote || '',
              '원래반': student.originalClass,
              '배정반': className
            });
          });
        });
        const allStudentsWs = XLSX.utils.json_to_sheet(allStudentsData);
        XLSX.utils.book_append_sheet(wb, allStudentsWs, '취합');

        // 2. 각 반별 시트 (A반, B반, C반...)
        Object.keys(results).sort().forEach(className => {
          const students = results[className];
          const data = students.map(s => ({
            '학생개인번호': s.studentId || '',
            '학년': s.grade || '',
            '반': s.originalClass,
            '번호': s.number,
            '이름': s.name,
            '성별': s.gender,
            '생년월일': s.birthDate || '',
            '특이사항': s.specialNote || '',

            (pair.student1.id === studentId2 && pair.student2.id === studentId1)

        return classStudents.some(s => s.id !== studentId && isProhibitedPair(studentId, s.id));

                                        background: pair.active ? '#ff6b6b' : '#4caf50',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '6px',
                                        cursor: 'pointer',
                                        fontSize: '0.9rem',
                                        fontWeight: '600',
                                        minWidth: '70px'
                                      }}
                                    >
                                      {pair.active ? '숨김' : '표시'}
                                    </button>
                                    <button
                                      onClick={() => {
                                        removeProhibitPair(index);
                                        setForceUpdateKey(prev => prev + 1);
                                      }}
                                      style={{
                                        padding: '0.5rem 1rem',
                                        background: '#666',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '6px',
                                        cursor: 'pointer',
                                        fontSize: '0.9rem',
                                        fontWeight: '600'
                                      }}
                                    >
                                      제거
                                    </button>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  };

                  return <ProhibitContent />;
                })()}
              </div>
            )}

            {/* 반편성 완료/수정 버튼 */}
            {results && (
              <div className="action-buttons" style={{
                display: 'flex',
                justifyContent: 'center',
                gap: '1rem',
                marginBottom: '2rem'
              }}>
                <button
                  onClick={() => setIsCompleted(!isCompleted)}
                  style={{
                    padding: '1rem 3rem',
                    background: isCompleted ? 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)' : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                    color: 'white',
                    border: 'none',
                    borderRadius: '12px',
                    fontSize: '1.2rem',
                    fontWeight: '700',
                    cursor: 'pointer',
                    boxShadow: '0 8px 20px rgba(0, 0, 0, 0.2)',
                    transition: 'all 0.3s'
                  }}
                  onMouseEnter={(e) => {
                    e.target.style.transform = 'translateY(-2px)';
                    e.target.style.boxShadow = '0 12px 28px rgba(0, 0, 0, 0.3)';
                  }}
                  onMouseLeave={(e) => {
                    e.target.style.transform = 'translateY(0)';
                    e.target.style.boxShadow = '0 8px 20px rgba(0, 0, 0, 0.2)';
                  }}
                >
                  {isCompleted ? '✏️ 반편성 수정하기' : '✅ 반편성 완료하기'}
                </button>

                <button
                  onClick={downloadExcel}
                  style={{
                    padding: '1rem 3rem',
                    background: '#4caf50',
                    color: 'white',
                    border: 'none',
                    borderRadius: '12px',
                    fontSize: '1.2rem',
                    fontWeight: '700',
                    cursor: 'pointer',
                    boxShadow: '0 4px 12px rgba(76, 175, 80, 0.3)',
                    transition: 'all 0.3s'
                  }}
                  onMouseEnter={(e) => {
                    e.target.style.background = '#45a049';
                    e.target.style.transform = 'translateY(-2px)';
                    e.target.style.boxShadow = '0 6px 16px rgba(76, 175, 80, 0.4)';
                  }}
                  onMouseLeave={(e) => {
                    e.target.style.background = '#4caf50';
                    e.target.style.transform = 'translateY(0)';
                    e.target.style.boxShadow = '0 4px 12px rgba(76, 175, 80, 0.3)';
                  }}
                >
                  ⬇️ 엑셀 다운로드
                </button>
              </div>
            )}

            {/* 같은 반 금지 학생 설정 모달 (제거 예정 - 사용 안 함) */}
            {showProhibitModal && results && (
              <div
                style={{
                  position: 'fixed',
                  top: 0,
                  left: 0,
                  right: 0,
                  bottom: 0,
                  background: 'rgba(0, 0, 0, 0.5)',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  zIndex: 1000,
                  padding: '1rem'
                }}
                onClick={() => setShowProhibitModal(false)}
              >
                <div
                  style={{
                    background: '#fce4ec',
                    borderRadius: '16px',
                    padding: '2rem',
                    maxWidth: '900px',
                    width: '100%',
                    maxHeight: '90vh',
                    overflowY: 'auto',
                    boxShadow: '0 20px 60px rgba(0, 0, 0, 0.3)'
                  }}
                  onClick={(e) => e.stopPropagation()}
                >
                  <h3 style={{
                    margin: '0 0 1.5rem 0',
                    fontSize: '1.5rem',
                    fontWeight: '700',
                    color: '#c2185b',
                    textAlign: 'center'
                  }}>
                    같은 반 금지 학생 표시
                  </h3>

                  {(() => {
                    const ProhibitModalContent = () => {
                      const [student1, setStudent1] = React.useState('');
                      const [student2, setStudent2] = React.useState('');

                      // 모든 학생 목록 (원래반 순서대로)
                      const allStudents = [];
                      Object.keys(results).sort().forEach(className => {
                        results[className].forEach(student => {
                          allStudents.push({
                            ...student,
                            currentClass: className
                          });
                        });
                      });

                      // 원래반과 번호로 정렬
                      allStudents.sort((a, b) => {
                        const classA = parseInt(a.originalClass) || 0;
                        const classB = parseInt(b.originalClass) || 0;
                        if (classA !== classB) return classA - classB;
                        return (parseInt(a.number) || 0) - (parseInt(b.number) || 0);
                      });

                      const addProhibitPair = () => {
                        if (!student1 || !student2) {
                          alert('두 명의 학생을 모두 선택해주세요.');
                          return;
                        }
                        if (student1 === student2) {
                          alert('같은 학생을 선택할 수 없습니다.');
                          return;
                        }

                        const s1 = allStudents.find(s => s.id === student1);
                        const s2 = allStudents.find(s => s.id === student2);

                        if (prohibitPairs.some(pair => 
                          (pair.student1.id === student1 && pair.student2.id === student2) ||
                          (pair.student1.id === student2 && pair.student2.id === student1)
                        )) {
                          alert('이미 등록된 금지 조합입니다.');
                          return;
                        }

                        setProhibitPairs([...prohibitPairs, {
                          student1: { id: s1.id, name: s1.name, class: s1.currentClass },
                          student2: { id: s2.id, name: s2.name, class: s2.currentClass }
                        }]);

                        setStudent1('');
                        setStudent2('');
                      };

                      const removeProhibitPair = (index) => {
                        setProhibitPairs(prohibitPairs.filter((_, i) => i !== index));
                      };

                      return (
                        <div>
                          <div style={{
                            display: 'flex',
                            gap: '1rem',
                            marginBottom: '1.5rem',
                            flexWrap: 'wrap'
                          }}>
                            <select
                              value={student1}
                              onChange={(e) => setStudent1(e.target.value)}
                              style={{
                                flex: 1,
                                minWidth: '200px',
                                padding: '0.75rem',
                                fontSize: '1rem',
                                borderRadius: '8px',
                                border: '2px solid #e0e0e0',
                                background: 'white'
                              }}
                            >
                              <option value="">학생 선택</option>
                              {allStudents.map(student => (
                                <option key={student.id} value={student.id}>
                                  {student.originalClass}반 {student.number}번 {student.name} (현재: {student.currentClass})
                                </option>
                              ))}
                            </select>

                            <select
                              value={student2}
                              onChange={(e) => setStudent2(e.target.value)}
                              style={{
                                flex: 1,
                                minWidth: '200px',
                                padding: '0.75rem',
                                fontSize: '1rem',
                                borderRadius: '8px',
                                border: '2px solid #e0e0e0',
                                background: 'white'
                              }}
                            >
                              <option value="">학생 선택</option>
                              {allStudents.map(student => (
                                <option key={student.id} value={student.id}>
                                  {student.originalClass}반 {student.number}번 {student.name} (현재: {student.currentClass})
                                </option>
                              ))}
                            </select>

                            <button
                              onClick={addProhibitPair}
                              style={{
                                padding: '0.75rem 1.5rem',
                                background: '#c2185b',
                                color: 'white',
                                border: 'none',
                                borderRadius: '8px',
                                fontWeight: '600',
                                cursor: 'pointer',
                                fontSize: '1rem'
                              }}
                            >
                              추가
                            </button>
                          </div>

                          {/* 등록된 금지 조합 목록 */}
                          {prohibitPairs.length > 0 && (
                            <div style={{
                              background: 'white',
                              borderRadius: '8px',
                              padding: '1rem',
                              marginBottom: '1rem'
                            }}>
                              <h4 style={{
                                margin: '0 0 1rem 0',
                                fontSize: '1.1rem',
                                fontWeight: '600',
                                color: '#333'
                              }}>
                                등록된 금지 조합 ({prohibitPairs.length}개)
                              </h4>
                              {prohibitPairs.map((pair, index) => (
                                <div
                                  key={index}
                                  style={{
                                    display: 'flex',
                                    justifyContent: 'space-between',
                                    alignItems: 'center',
                                    padding: '0.75rem',
                                    marginBottom: '0.5rem',
                                    background: '#f8f9fa',
                                    borderRadius: '8px',
                                    border: '1px solid #e0e0e0'
                                  }}
                                >
                                  <span style={{ fontSize: '0.95rem', color: '#333' }}>
                                    {pair.student1.name} ({pair.student1.class}) ↔ {pair.student2.name} ({pair.student2.class})
                                  </span>
                                  <button
                                    onClick={() => removeProhibitPair(index)}
                                    style={{
                                      padding: '0.4rem 0.8rem',
                                      background: '#ff6b6b',
                                      color: 'white',
                                      border: 'none',
                                      borderRadius: '6px',
                                      cursor: 'pointer',
                                      fontSize: '0.85rem',
                                      fontWeight: '600'
                                    }}
                                  >
                                    삭제
                                  </button>
                                </div>
                              ))}
                            </div>
                          )}

                          <button
                            onClick={() => setShowProhibitModal(false)}
                            style={{
                              width: '100%',
                              padding: '1rem',
                              background: '#c2185b',
                              color: 'white',
                              border: 'none',
                              borderRadius: '8px',
                              fontSize: '1.1rem',
                              fontWeight: '700',
                              cursor: 'pointer'
                            }}
                          >
                            확인
                          </button>
                        </div>
                      );
                    };

                    return <ProhibitModalContent />;
                  })()}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
